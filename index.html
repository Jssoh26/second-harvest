      ${G.regions().map(d => html`<path d=${d} fill="var(--land)" stroke="var(--land-line)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="4 4" opacity=".95"/>`)}
      ${G.outline() && html`<path d=${G.outline()} fill="none" stroke="var(--land-line)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}
      ${G.river && html`<path d=${G.river()} fill="none" stroke="var(--water-2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d=${G.river()} fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`}
      <g>${G.labels.filter(l => l[3] !== 'brand' || k > 1.4).map(([n, la, lo, t]) => { const [x, y] = P(la, lo); return html`<text x=${x} y=${y} text-anchor="middle" style=${LS[t]()} pointer-events="none">${n}</text>`; })}</g>
      ${routePts && html`<g><polyline points=${routePts.map(p => p.join(',')).join(' ')} fill="none" stroke="var(--brand)" stroke-opacity=".22" stroke-width=${9 / k} stroke-linecap="round" stroke-linejoin="round"/>
        <polyline class="route-line" points=${routePts.map(p => p.join(',')).join(' ')} stroke-width=${3.2 / k} style=${`stroke-dasharray:${10 / k} ${7 / k};--dash:${17 / k}`}/></g>`}
      ${depot && (() => { const [x, y] = P(depot.lat, depot.lon); return html`<g transform=${`translate(${x} ${y}) scale(${1 / k})`}><rect x="-9" y="-9" width="18" height="18" rx="5" fill="var(--ink)"/><path d="M-4 1l4-4 4 4M0-3v7" stroke="var(--bg)" stroke-width="2" fill="none" stroke-linecap="round"/><text class="pin-label" x="13" y="4" style="font-size:12px">${depot.name}</text></g>`; })()}
      ${facilities.map(f => { const [x, y] = P(f.lat, f.lon); const rem = Math.max(0, f.dailyQuotaKg - (intake[f.id] || 0)); const sel = selected === f.id; const pr = clamp(1 - rem / f.dailyQuotaKg, 0, 1);
        return html`<g class="pin" transform=${`translate(${x} ${y}) scale(${1 / k})`} onClick=${() => onSelect(f.id)} onMouseEnter=${tipOn(`${f.name} · ${fmt(rem)} kg open`)} onMouseLeave=${tipOff}>
          ${sel && html`<circle r="24" fill="var(--kaya)" opacity=".25"/>`}
          <rect x="-15" y="-15" width="30" height="30" rx="9" fill="#F2B13B" stroke="#7A4A06" stroke-width="1.5"/>
          <g transform="rotate(-18)"><rect x="-8.5" y="-3.6" width="17" height="7.2" rx="3.6" fill="#FFF3D1" stroke="#7A4A06" stroke-width="1"/><path d="M-4 -3.4v6.8M0 -3.6v7.2M4 -3.4v6.8" stroke="#B8893A" stroke-width=".9"/><circle cx="6.4" cy="0" r="1.5" fill="#3A2A12"/></g>
          <rect x="-15" y="19" width="30" height="5" rx="2.5" fill="var(--surface)" stroke="var(--line-2)" stroke-width=".8"/><rect x="-15" y="19" width=${30 * pr} height="5" rx="2.5" fill=${pr >= 1 ? 'var(--ink-3)' : 'var(--brand)'}/>
          ${(k > 1.6 || sel) && html`<text class="pin-label" x="20" y="-4" style="font-size:12.5px">${f.name}</text><text class="pin-label" x="20" y="11" style="font-size:11px;font-weight:600;fill:var(--ink-2)">${rem > 0 ? fmt(rem) + ' kg open' : 'Full today'}</text>`}</g>`; })}
      ${bins.map(b => { const [x, y] = P(b.lat, b.lon); const st = STATUS[b.status]; const sel = selected === b.id; const r = 10, C = 2 * Math.PI * r; const dim = b.p < READY;
        return html`<g class="pin" transform=${`translate(${x} ${y}) scale(${1 / k})`} onClick=${() => onSelect(b.id)} onMouseEnter=${tipOn(`${b.name} · ${pct(b.p)} full`)} onMouseLeave=${tipOff} opacity=${dim && !sel ? 0.75 : 1}>
          ${b.status === 'overflow' && html`<circle class="overflow-ring" r="13" fill="none" stroke="var(--crit)" stroke-width="2"/>`}
          ${sel && html`<circle r="21" fill=${st.color} opacity=".2"/>`}
          <circle r="13.5" fill="var(--surface)" stroke=${sel ? 'var(--ink)' : 'var(--line-2)'} stroke-width=${sel ? 2 : 1}/>
          <circle r=${r} fill="none" stroke="var(--surface-3)" stroke-width="3.6"/>
          <circle r=${r} fill="none" stroke=${st.color} stroke-width="3.6" stroke-dasharray=${`${C * clamp(b.p, 0, 1)} ${C}`} transform="rotate(-90)" stroke-linecap="round"/>
          <circle r="4.2" fill=${st.color}/>
          ${(showLabels || sel) && html`<text class="pin-label" x="18" y="4.5" style="font-size:12.5px">${b.name.replace(' Food Centre', '').replace(' Market & Food Centre', '').replace(' RFID bins', '')} · ${pct(b.p)}</text>`}</g>`; })}
      ${routePts && route.slice(1, -1).map((s, i) => { const [x, y] = P(s.lat, s.lon); return html`<g transform=${`translate(${x} ${y}) scale(${1 / k})`} style="pointer-events:none"><circle cx="11" cy="-11" r="9" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/><text x="11" y="-7.2" text-anchor="middle" style="font:800 11px var(--f-display);fill:var(--brand-ink)">${i + 1}</text></g>`; })}
    </svg>`}
    ${children}
    <div class="map-ui br"><div class="zoom">
      <button aria-label="Zoom in" onClick=${() => zoomAt(1.5, 0.5, 0.5)}>${Ic.plus()}</button>
      <button aria-label="Zoom out" onClick=${() => zoomAt(1 / 1.5, 0.5, 0.5)}>${Ic.minus()}</button>
      <button aria-label="Show the whole city" title="Whole city" onClick=${() => size && setVb(fitBox(G.box, size))}>${Ic.target()}</button>
      ${G.zoom2 && html`<button aria-label="Zoom to NTU" title="NTU campus" onClick=${() => size && setVb(fitBox(G.zoom2[1], size))} style="font:800 10px var(--f-display)">NTU</button>`}</div></div>
  </div>`;
}

function useCity(c) {
  const { D } = c;
  return useMemo(() => ({ id: REGIONS[REG].city, bins: D.bins, facilities: D.facilities, intake: D.intake, depots: depots(), zones: zonesOf(), byId: id => D.binById[id] || D.facById[id] }), [D, REG]);
}

function MapView({ c, params }) {
  const { D, role } = c;
  const canRoute = role === 'collector';
  const city = useCity(c); const cityId = city.id;
  const [showAll, setShowAll] = useState(role === 'contributor');
  const [zone, setZone] = useState('All');
  const [showFac, setShowFac] = useState(true);
  const [tab, setTab] = useState(params?.tab === 'route' && canRoute ? 'route' : canRoute ? 'route' : 'capacity');
  const [sel, setSel] = useState(params?.select || null);
  const [focus, setFocus] = useState(null);
  const [plan, setPlan] = useState(null);
  useEffect(() => { if (params?.tab && (params.tab !== 'route' || canRoute)) setTab(params.tab); if (params?.select) { setSel(params.select); const b = D.binById[params.select] || D.facById[params.select]; if (b) setFocus({ lat: b.lat, lon: b.lon, w: 160, key: 'p' + Date.now() }); } }, [params]);
  useEffect(() => { setTab(canRoute ? 'route' : 'capacity'); setShowAll(role === 'contributor'); }, [role]);
  useEffect(() => { setSel(null); setPlan(null); setZone('All'); setFocus(null); }, [cityId]);
  const active = D.activePickup;
  const zoneBins = city.bins.filter(b => zone === 'All' || b.zone === zone);
  const visible = zoneBins.filter(b => showAll || b.p >= READY || b.id === sel);
  const listBins = zoneBins.filter(b => showAll || b.p >= READY).sort((a, b) => b.p - a.p);
  const ready = city.bins.filter(b => b.p >= READY).length;
  const routePts = active ? [D.depotFor(active.depot), ...active.stops.map(s => D.binById[s.binId]).filter(Boolean), D.facById[active.facilityId]].filter(Boolean)
    : plan && !plan.empty && plan.city === cityId ? [plan.depot, ...plan.seq, plan.fac] : null;
  const depot = active ? D.depotFor(active.depot) : plan && !plan.empty && plan.city === cityId ? plan.depot : null;
  const selItem = sel && city.byId(sel); const selIsFac = selItem && city.facilities.some(f => f.id === sel);
  const P = CITY_GEO[cityId].proj;
  const focusZone = z => { setZone(z); if (z === 'All') return setFocus({ box: CITY_GEO[cityId].box, key: 'z' + Date.now() }); if (z === 'NTU') return setFocus({ box: NTU_BOX, key: 'z' + Date.now() });
    const zb = city.bins.filter(b => b.zone === z); if (zb.length) { const ps = zb.map(b => P(b.lat, b.lon)); const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]); setFocus({ box: [Math.min(...xs) - 40, Math.min(...ys) - 40, Math.max(...xs) + 40, Math.max(...ys) + 40], key: 'z' + Date.now() }); } };
  const tabs = canRoute ? [['route', active ? 'Active route' : 'Route planner'], ['bins', 'Collection points']] : [['capacity', 'Live capacity'], ['bins', 'Collection points']];
  return html`<div class="mapwrap">
    <${SgMap} cityId=${cityId} bins=${visible} facilities=${showFac ? city.facilities : []} intake=${city.intake} selected=${sel} onSelect=${id => { setSel(id); if (tab !== 'bins' && !(canRoute && (plan || active))) setTab('bins'); }} route=${routePts} depot=${depot} focus=${focus}>
      <div class="map-ui tl">
        <span class="chip" style="pointer-events:none">${R_().flag} ${R_().name}</span>
        <${Seg} label="Bins shown" value=${showAll ? 'all' : 'ready'} onChange=${v => setShowAll(v === 'all')} options=${[['ready', `≥80% (${ready})`], ['all', 'All']]}/>
        <button class="chip" aria-pressed=${showFac} onClick=${() => setShowFac(!showFac)}>${Ic.layers()} <span class="hide-xs">BSF facilities</span></button>
      </div>
      <div class="map-ui bl"><div class="legend"><span><i style="background:var(--crit)"></i>Overflowing</span><span><i style="background:var(--warn)"></i>Ready ≥80%</span>${showAll && html`<span><i style="background:var(--good)"></i>Filling</span>`}<span><i style="background:var(--kaya);border-radius:3px"></i>BSF facility</span></div></div>
    </${SgMap}>
    <div class="panel">
      <div class="chips scroll">${['All', ...city.zones].map(z => html`<button class="chip" aria-pressed=${zone === z} onClick=${() => focusZone(z)}>${z === 'All' ? 'All ' + R_().name : z}</button>`)}</div>
      ${selItem && !selIsFac && html`<${BinDetail} c=${c} b=${selItem} preview=${false} onClose=${() => setSel(null)}/>`}
      ${selItem && selIsFac && html`<${FacDetail} c=${c} f=${selItem} intake=${city.intake} preview=${false} onClose=${() => setSel(null)}/>`}
      <${Seg} label="Panel" value=${tab} onChange=${setTab} options=${tabs}/>
      ${tab === 'capacity' && html`<${LiveCapacity} c=${c} bins=${city.bins} city=${city}/>`}
      ${tab === 'bins' && html`<div class="card" style="padding:14px 16px">
          <div class="row wrap" style="gap:6px;margin-bottom:6px"><span class="pill crit">${zoneBins.filter(b => b.status === 'overflow').length} overflowing</span><span class="pill warn">${zoneBins.filter(b => b.status === 'ready').length} ready</span><span class="pill neutral">${zoneBins.filter(b => b.status === 'held').length} held</span>${showAll && html`<span class="pill good">${zoneBins.filter(b => b.status === 'filling').length} filling</span>`}</div>
          ${!showAll && html`<p class="tiny faint" style="margin:4px 0 6px">Bins appear here once their sensor reads 80% full. Switch to “All” to see every monitored point.</p>`}
          ${listBins.length ? listBins.map(b => html`<button class="binrow" aria-selected=${sel === b.id} onClick=${() => { setSel(b.id); setFocus({ lat: b.lat, lon: b.lon, w: 160, key: b.id + Date.now() }); }}>
            <${Ring} p=${b.p} size=${42} stroke=${5} color=${STATUS[b.status].color}><text x="21" y="25" text-anchor="middle" style="font:700 10.5px var(--f-mono);fill:var(--ink)">${Math.round(b.p * 100)}</text></${Ring}>
            <div style="min-width:0"><b class="small" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.name}</b><span class="tiny faint">${KIND_LABEL[b.kind] || b.kind} · ${b.zone} · ${fmt(b.kg)} kg</span></div>
            <${StatusPill} status=${b.status}/></button>`) : html`<${Empty} title="No bins at 80% here">Nothing needs collecting in this area right now.</${Empty}>`}</div>`}
      ${tab === 'route' && html`<${RoutePlanner} c=${c} zone=${zone} plan=${plan} setPlan=${setPlan} city=${city}/>`}
      ${canRoute && tab === 'bins' && html`<${SimPanel} c=${c}/>`}
    </div></div>`;
}

function SeoulCard() {
  return html`<div class="card seoulcard"><div class="row between"><div><div class="eyebrow">Why Seoul</div><h3>Seoul, South Korea</h3></div><span style="font-size:26px">🇰🇷</span></div>
    <p class="tiny muted" style="margin-top:4px">Seoul already runs smart weighing bins at scale. Adding BSF facilities turns that collected food waste into feed and fertiliser.</p>
    <div class="seoul-facts">${SEOUL_FACTS.map(([v, t]) => html`<div><b>${v}</b><span>${t}</span></div>`)}</div>
    <a class="tiny" href="https://www.weforum.org/stories/2019/04/south-korea-recycling-food-waste/" target="_blank" rel="noopener" style="color:var(--ink-3)">Source: World Economic Forum</a></div>`;
}

function BinDetail({ c, b, onClose, preview }) {
  const st = STATUS[b.status]; const role = c.role;
  const friendly = b.held ? 'Held until the stall re-sorts it. No pickup yet.' : b.p >= READY ? 'Full enough for pickup. A collector has been alerted.' : `About ${fmt(b.toReady || 0, 1)} h until it needs collecting.`;
  return html`<div class="card lift grow-in" style="padding:16px"><div class="row" style="align-items:flex-start">
      <div style="width:56px;flex:none">${Art.bin(b.p)}</div>
      <div class="grow stack" style="gap:4px"><div class="row between" style="align-items:flex-start"><div><div class="eyebrow">${KIND_LABEL[b.kind] || (b.kind === 'rfid' ? 'RFID apartment bins' : b.kind)} · ${b.zone}</div><h3>${b.name}</h3></div><button class="icon-btn" style="width:32px;height:32px" aria-label="Close details" onClick=${onClose}>${Ic.close()}</button></div>
        <div class="row wrap"><span class="num" style="font-size:24px;font-weight:600">${pct(b.p)}</span><span class=${'pill ' + st.cls}>${st.label}</span></div>
        <${Bar} p=${b.p} cls=${b.p >= 0.98 ? 'crit' : b.p >= READY ? 'warn' : ''}/></div></div>
    ${role === 'collector' || role === 'contributor' ? html`<table class="t" style="margin-top:10px;font-size:13.5px"><tbody>
      <tr><td class="muted">Waste in bin</td><td class="r num">${fmt(b.kg)} / ${fmt(b.capacityKg)} kg</td></tr>
      ${!preview && html`<tr><td class="muted">Fill rate</td><td class="r num">${fmt(b.ratePerHr, 1)} kg/h${b.p < READY ? ` · ready in ${fmt(b.toReady, 1)} h` : ''}</td></tr>`}
      <tr><td class="muted">Contamination (lid camera)</td><td class="r num" style=${b.held ? 'color:var(--crit)' : ''}>${fmt(b.contamPct, 1)}%</td></tr>
      ${!preview && html`<tr><td class="muted">Bin temperature</td><td class="r num" style=${b.tempC > 36 ? 'color:var(--warn)' : ''}>${fmt(b.tempC, 1)} °C</td></tr><tr><td class="muted">Last emptied</td><td class="r">${ago(b.lastEmptiedAt, c.now)}</td></tr>`}
      <tr><td class="muted">Sensor</td><td class="r">${b.sensor}</td></tr></tbody></table>`
      : html`<div class="friendly"><span>${Ic.info()}</span><div><b class="small">${fmt(b.kg)} of ${fmt(b.capacityKg)} kg</b><div class="tiny muted">${friendly}</div></div></div>`}
    ${b.held && role !== 'buyer' && html`<div class="row small" style="margin-top:10px;padding:10px;border-radius:12px;background:var(--crit-soft);color:var(--crit)"><span style="width:18px;flex:none">${Ic.alert()}</span><span><b>Held from routes.</b> Over ${CONTAM_LIMIT}% non-food.</span><${RTag} r="Reject"/></div>`}
    ${!preview && role === 'contributor' && html`<div class="row wrap" style="margin-top:12px"><button class="btn sm primary" onClick=${() => c.open('drop', { binId: b.id })}>${Ic.plus()} Log drop-off here</button></div>`}
    ${!preview && role === 'collector' && b.p >= READY && !b.held && html`<div class="tiny faint" style="margin-top:10px">Included automatically when you plan a route.</div>`}
    ${preview && html`<div class="tiny faint" style="margin-top:10px">Preview data for the Seoul expansion. Actions are only available in Singapore.</div>`}</div>`;
}

function FacDetail({ c, f, onClose, intake, preview }) {
  const got = (intake || c.D.intake)[f.id] || 0; const rem = Math.max(0, f.dailyQuotaKg - got);
  return html`<div class="card lift grow-in" style="padding:16px"><div class="row" style="align-items:flex-start"><div class="fac-art">${Art.factory()}</div>
    <div class="grow"><div class="eyebrow">BSF facility · ${f.area}</div><h3>${f.name}</h3><div class="small muted">${fmt(rem)} kg still needed today · ${f.window}</div></div>
    <button class="icon-btn" style="width:32px;height:32px" aria-label="Close details" onClick=${onClose}>${Ic.close()}</button></div>
    <div style="margin-top:10px"><${Bar} p=${got / f.dailyQuotaKg}/></div>
    <div class="chips" style="margin-top:10px">${f.accepts.map(a => html`<span class="pill neutral">${ACCEPT_LABEL[a]}</span>`)}${f.urgent && html`<span class="pill crit">Urgent need</span>`}</div>
    ${!preview && html`<div class="row wrap" style="margin-top:12px">${ROLE_NAV[c.role].includes('quotas') && html`<button class="btn sm" onClick=${() => c.go('quotas')}>${Ic.gauge()} Quota details</button>`}${ROLE_NAV[c.role].includes('market') && html`<button class="btn sm" onClick=${() => c.go('market', { facility: f.id })}>${Ic.bag()} Their products</button>`}</div>`}
    ${preview && html`<div class="tiny faint" style="margin-top:10px">Proposed facility for the Seoul preview.</div>`}</div>`;
}

function SimPanel({ c }) {
  const [busy, setBusy] = useState(false);
  const run = async k => { setBusy(true); await c.act.simulate(k); setBusy(false); };
  return html`<div class="card" style="padding:14px 16px;background:var(--surface-2)"><div class="row between"><div><div class="eyebrow">Sensor simulator</div><div class="small muted">Prototype only: move the clock to see bins cross 80%.</div></div><${RTag} r="Redesign"/></div>
    <div class="row wrap" style="margin-top:10px"><button class="btn sm" disabled=${busy} onClick=${() => run('hour')}>${Ic.ff()} +1 hour</button><button class="btn sm" disabled=${busy} onClick=${() => run('lunch')}>${Ic.clock()} Lunch rush</button><button class="btn sm ghost" disabled=${busy} onClick=${() => run('morning')}>${Ic.refresh()} Reset to morning</button></div></div>`;
}

function RoutePlanner({ c, zone, plan, setPlan, city }) {
  const { D, role, persona } = c; const isSG = true;
  const active = D.activePickup;
  const defDepot = () => (zone !== 'All' ? city.depots.find(d => d.zone === zone)?.id : null) || persona.depot || city.depots[0].id;
  const [depot, setDepot] = useState(defDepot());
  const [area, setArea] = useState(zone);
  const [cap, setCap] = useState(1000);
  useEffect(() => { setDepot(defDepot()); setArea('All'); }, [city.id]);
  useEffect(() => { setArea(zone); if (zone !== 'All') { const d = city.depots.find(x => x.zone === zone); if (d) setDepot(d.id); } }, [zone]);
  if (active) return html`<div class="card"><div class="card-h"><div><div class="eyebrow">Active route</div><h3>${active.stops.filter(s => s.done).length} of ${active.stops.length} collected</h3></div><${RTag} r="Reduce"/></div><${ActiveRoute} c=${c} p=${active}/></div>`;
  const dep = city.depots.find(d => d.id === depot) || city.depots[0];
  const run = () => setPlan({ ...planRoute({ depot: dep, capacity: cap, zone: area, bins: city.bins, facilities: city.facilities, intake: city.intake }), depot: dep, area, cap, city: city.id, at: Date.now() });
  const p = plan && plan.city === city.id ? plan : null;
  const savedKm = p && !p.empty ? p.baselineKm - p.km : 0;
  return html`<div class="card"><div class="card-h"><div><div class="eyebrow">Smart route${isSG ? '' : ' · Seoul preview'}</div><h3>Plan from live bin levels</h3></div><${RTag} r="Reduce"/></div>
    <div class="grid g2" style="gap:12px">
      <div class="field"><label for="rp-depot">Start from</label><select id="rp-depot" class="input" value=${depot} onChange=${e => { setDepot(e.target.value); setPlan(null); }}>${city.depots.map(d => html`<option value=${d.id}>${d.name}</option>`)}</select></div>
      <div class="field"><label for="rp-area">Service area</label><select id="rp-area" class="input" value=${area} onChange=${e => { setArea(e.target.value); setPlan(null); }}>${['All', ...city.zones].map(z => html`<option value=${z}>${z === 'All' ? 'Whole city' : z}</option>`)}</select></div></div>
    <div class="field" style="margin-top:12px"><label for="rp-cap">Van capacity: <span class="num">${fmt(cap)} kg</span></label><input id="rp-cap" type="range" min="200" max="2500" step="50" value=${cap} onInput=${e => { setCap(+e.target.value); setPlan(null); }}/></div>
    <button class="btn primary block" style="margin-top:14px" onClick=${run}>${Ic.route()} Plan route</button>
    ${p && p.empty && html`<div style="margin-top:12px"><${Empty} title="Nothing to collect yet">No bin in this area is at 80% and clean enough to collect. Try another area${isSG ? ' or use the sensor simulator' : ''}.</${Empty}></div>`}
    ${p && !p.empty && html`<div class="stack grow-in" style="margin-top:16px;gap:14px">
      <div class="savings"><div><b>${p.seq.length}</b><span>stops</span></div><div><b>${fmt(p.load)} kg</b><span>load · ${pct(p.load / p.cap)} of van</span></div><div><b>${fmt(p.km, 1)} km</b><span>~${fmt(p.minutes)} min</span></div></div>
      <div class="compare"><div class="row between"><span>Smart route</span><b class="num">${fmt(p.km, 1)} km</b></div><${Bar} p=${p.km / p.baselineKm}/>
        <div class="row between"><span>Fixed daily round (all ${p.baselineStops} bins)</span><b class="num">${fmt(p.baselineKm, 1)} km</b></div><${Bar} p=${1} cls="warn"/>
        <div class="small" style="color:var(--good);font-weight:700">${fmt(savedKm, 1)} km shorter · ${fmt(savedKm * VAN_CO2_PER_KM, 1)} kg CO₂e avoided</div></div>
      <div class="stops">
        <div class="stop"><span class="n" style="background:var(--ink);color:var(--bg)">${Ic.truck()}</span><div><b class="small">${p.depot.name}</b></div><span></span></div>

      ${p.heldBins.length > 0 && html`<div class="small muted"><${RTag} r="Reject"/> Skipped ${p.heldBins.map(b => b.name).join(', ')}: too much plastic.</div>`}

/* ===== Market ===== */
const unitKg = p => { const m = /([\d.]+)\s*(kg|g)/i.exec(p.unit || ''); if (!m) return p.art === 'kit' ? 2 : 1; return m[2].toLowerCase() === 'g' ? +m[1] / 1000 : +m[1]; };
function specChips(p) {
  const s = [];
  if (p.n != null) s.push(`N-P-K ${fmt(p.n, 1)}-${fmt(p.p, 1)}-${fmt(p.k, 1)}`);
  if (p.protein != null) s.push(`${p.protein}% protein`);
  if (p.fat != null) s.push(`${p.fat}% fat`);
  if (p.chitin != null) s.push(`${p.chitin}% chitin`);
  return s;
}
function ProductCard({ c, p, compact }) {
  const { D } = c; const f = D.facById[p.facilityId]; const r = D.ratings[p.id];
  const mine = c.role === 'facility' && c.persona.id === p.facilityId;
  const inCart = c.cart.find(x => x.id === p.id);
  return html`<article class="prod">
    <button class="prod-art" onClick=${() => c.open('product', { id: p.id })} aria-label=${'View ' + p.name}><${ProductArt} art=${p.art} hue=${p.hue}/>
      ${p.tags?.[0] ? html`<span class="pill brand">${Ic.sparkle()} ${p.tags[0]}</span>` : p.stock < 40 ? html`<span class="pill warn">Only ${p.stock} left</span>` : ''}</button>
    <div class="prod-b"><div class="tiny faint">${f?.name || ''}</div><h3><button onClick=${() => c.open('product', { id: p.id })}>${p.name}</button></h3>
      ${!compact && html`<div class="specs">${specChips(p).map(s => html`<span class="spec">${s}</span>`)}</div>`}
      ${r ? html`<${Stars} v=${r.overall} n=${r.n}/>` : html`<span class="tiny faint">No reviews yet</span>`}
      <div class="row between" style="margin-top:auto;padding-top:4px"><div class="price">${money(p.price)}<small>${p.unit}</small></div>
        ${mine ? html`<button class="btn sm" onClick=${() => c.open('editProduct', { id: p.id })}>${Ic.edit()}</button>`
          : html`<button class=${'btn sm ' + (inCart ? '' : 'primary')} disabled=${!p.stock || !p.active} onClick=${() => c.addToCart(p.id)} aria-label=${'Add ' + p.name + ' to cart'}>${inCart ? html`${Ic.check()} ${inCart.qty}` : Ic.plus()}</button>`}</div></div></article>`;
}

  const seg = role === 'buyer' ? persona.segment : null;
  const recs = role === 'buyer' ? D.recsFor(persona.id) : [];
  const recScore = Object.fromEntries(recs.map((p, i) => [p.id, recs.length - i]));
  let list = D.products.filter(p => p.active !== false && (cat === 'All' || p.category === cat) && (fac === 'All' || p.facilityId === fac) && (!q || (p.name + ' ' + p.desc + ' ' + p.category).toLowerCase().includes(q.toLowerCase())));

    ${role === 'buyer' && html`<div class="perk kaya slim"><div class="perk-ico">${Ic.gift()}</div><div class="grow"><b>1% back in Harvest points on every order</b><span class="small"> · 10% off when you buy 10+ packs</span></div><span class="points"><${Coin}/>${fmt(D.balance(persona.id))}</span></div>`}
    ${isFac && tab === 'listings' ? html`<${Listings} c=${c}/>` : isFac && tab === 'orders' ? html`<${FacOrders} c=${c}/>` : html`
    ${role === 'buyer' && recs.gap && recs.gap.length > 0 && html`<div class="repair"><div class="row between wrap"><div class="row"><${RTag} r="Repair"/><b>Your last soil test (${dateLabel(recs.test.at)}) is low in ${recs.gap.map(g => nName(g)).join(', ')}.</b></div>
      <button class="btn sm" onClick=${() => c.go('insights', { tab: 'soil' })}>${Ic.flask()} See soil match</button></div><span class="small muted">Products that close those gaps are sorted to the top.</span></div>`}
    <div class="shop-bar"><div class="search"><span>${Ic.search()}</span><input class="input" type="search" placeholder="Search frass, fish feed, larvae…" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Search products"/></div>

    <p class="tiny faint"><${RTag} r="Remanufacture"/> Every product is made from food waste collected through Second Harvest. Prices are sample prices for this prototype.</p>`}`;
}

function CartSheet({ c, onClose }) {
  const { D, persona } = c;
  const lines = c.cart.map(x => ({ ...x, p: D.prodById[x.id] })).filter(x => x.p);
  const subtotal = sum(lines, l => l.qty * l.p.price);
  const vouchers = D.vouchers.filter(v => v.who === persona.id && !v.used && v.value);
  const [vid, setVid] = useState(''); const v = vouchers.find(x => x.id === vid);
  const vOk = v && (!v.min || subtotal >= v.min); const vVal = vOk ? Math.min(v.value, subtotal) : 0;
  const bal = D.balance(persona.id);
  const maxPts = Math.max(0, Math.min(bal, Math.floor((subtotal - vVal) * 0.3 / R_().unit) * 100));
  const [pts, setPts] = useState(0); const usePts = Math.min(pts, maxPts);
  const bulk = lines.some(l => l.qty >= 10) ? sum(lines.filter(l => l.qty >= 10), l => l.qty * l.p.price) * 0.1 : 0;
  const total = Math.max(0, subtotal - vVal - bulk - ptsValue(usePts));
  const [busy, setBusy] = useState(false);
  const isBuyer = c.role === 'buyer';
  const place = async () => { setBusy(true); const ok = await c.act.placeOrder({ lines, voucher: vOk ? v : null, points: usePts, subtotal, total }); setBusy(false); if (ok) onClose(); };
  return html`<${Sheet} title="Your cart" sub=${isBuyer ? 'Ordering as ' + persona.name : ''} onClose=${onClose}
    footer=${lines.length ? (isBuyer ? html`<button class="btn primary grow" disabled=${busy} onClick=${place}>${busy ? 'Placing order…' : 'Place order · ' + money(total)}</button>` : html`<button class="btn grow" onClick=${() => c.setRole('buyer')}>${Ic.swap()} Switch to a buyer account to check out</button>`) : null}>
    ${lines.length ? html`<div>${lines.map(l => html`<div class="cart-line"><div class="thumb"><${ProductArt} art=${l.p.art} hue=${l.p.hue}/></div>
        <div style="min-width:0"><b class="small" style="display:block">${l.p.name}</b><span class="tiny faint">${money(l.p.price)} · ${l.p.unit}</span>
          <div style="margin-top:6px"><${Stepper} value=${l.qty} min=${0} max=${l.p.stock} onChange=${n => c.setQty(l.id, n)}/></div></div>
        <b class="num">${money(l.qty * l.p.price)}</b></div>`)}</div>
      <div class="stack" style="gap:10px;padding:14px;border-radius:16px;background:var(--kaya-soft)">
        <div class="row between"><b style="color:var(--kaya-ink)">Pay with Harvest points</b><span class="points" style="padding:4px 10px 4px 4px;background:var(--surface)"><${Coin}/>${fmt(bal)}</span></div>
        ${vouchers.length > 0 && html`<div class="field"><label for="cart-v">Voucher</label><select id="cart-v" class="input" value=${vid} onChange=${e => setVid(e.target.value)}><option value="">No voucher</option>${vouchers.map(x => html`<option value=${x.id}>${x.title}${x.min && subtotal < x.min ? ' (needs $' + x.min + ')' : ''}</option>`)}</select></div>`}
        <div class="field"><label for="cart-pts">Use points: <span class="num">${fmt(usePts)}</span> pts = ${money(ptsValue(usePts))} off</label>
          <input id="cart-pts" type="range" min="0" max=${maxPts} step="50" value=${usePts} disabled=${!maxPts} onInput=${e => setPts(+e.target.value)}/>
          <span class="tiny" style="color:var(--kaya-ink)">100 points = ${money0(R_().unit)}. Points can cover up to 30% of an order.</span></div></div>
      <div class="totals"><div class="row"><span>Subtotal</span><span class="num">${money(subtotal)}</span></div>
        ${vVal > 0 && html`<div class="row" style="color:var(--good)"><span>Voucher</span><span class="num">−${money(vVal)}</span></div>`}
        ${usePts > 0 && html`<div class="row" style="color:var(--good)"><span>Points</span><span class="num">−${money(ptsValue(usePts))}</span></div>`}
        ${bulk > 0 && html`<div class="row" style="color:var(--good)"><span>Bulk deal (10% off 10+ packs)</span><span class="num">−${money(bulk)}</span></div>`}
        <div class="row grand"><span>Total</span><span class="num">${money(total)}</span></div>
        <div class="tiny faint">You'll earn ${fmt(Math.floor(total / R_().unit))} points (1% back) on this order. Delivery is arranged by each facility.</div></div>`
      : html`<${Empty} title="Your cart is empty">Add frass or BSF feed from the marketplace.</${Empty}>`}

/* ===== Rewards ===== */

  const mine = D.ledger.filter(l => l.who === persona.id && l.delta !== 0).sort((a, b) => b.at - a.at);
  const vouchers = D.vouchers.filter(v => v.who === persona.id).sort((a, b) => b.at - a.at);
  const [busy, setBusy] = useState(null);
  const redeem = async r => { setBusy(r.id); await c.act.redeem(r); setBusy(null); };
  return html`<div class="split"><div class="stack">

function Insights({ c, params }) {

  const [tab, setTab] = useState(params?.tab || (role === 'buyer' ? 'soil' : 'analytics'));
  useEffect(() => { if (params?.tab) setTab(params.tab); }, [params]);
  return html`<${Seg} label="Insights" value=${tab} onChange=${setTab} options=${[['analytics', 'Feedback analytics'], ['soil', 'Soil match'], ['give', 'Give feedback']]}/>
    ${tab === 'analytics' && html`<${Analytics} c=${c}/>`}${tab === 'soil' && html`<${SoilMatch} c=${c}/>`}${tab === 'give' && html`<${GiveFeedback} c=${c} productId=${params?.product}/>`}`;

function heatBg(v) { const x = clamp((v - 1) / 4, 0, 1); return `background:color-mix(in srgb,var(--brand) ${Math.round(8 + x * 72)}%,var(--surface));color:${x > 0.55 ? 'var(--brand-ink)' : 'var(--ink)'}`; }
function Analytics({ c }) {

  const fitPct = fb.length ? fb.filter(x => x.fit >= 4).length / fb.length : 0;
  const tags = {}; fb.forEach(x => (x.tags || []).forEach(t => tags[t] = (tags[t] || 0) + 1));
  const issues = Object.entries(tags).filter(([t]) => BAD_TAGS.includes(t)).sort((a, b) => b[1] - a[1]);
  const praise = Object.entries(tags).filter(([t]) => !BAD_TAGS.includes(t)).sort((a, b) => b[1] - a[1]);
  const maxTag = Math.max(1, ...Object.values(tags));
  const segs = Object.keys(SEGMENTS).map(s => [s, fb.filter(x => x.segment === s)]).filter(([, a]) => a.length);
  const prods = D.products.filter(p => fid === 'All' || p.facilityId === fid).map(p => { const a = fb.filter(x => x.productId === p.id); const it = {}; a.forEach(x => (x.tags || []).filter(t => BAD_TAGS.includes(t)).forEach(t => it[t] = (it[t] || 0) + 1)); return { p, n: a.length, fit: avg(a.map(x => x.fit)), issue: Object.entries(it).sort((x, y) => y[1] - x[1])[0] }; }).sort((a, b) => b.n - a.n);
  // nutrient gaps from latest soil test per buyer
  const latest = Object.values(groupBy(D.soiltests, t => t.buyerId)).map(a => a.sort((x, y) => y.at - x.at)[0]);
  const gapCount = { n: 0, p: 0, k: 0, ph: 0, om: 0 }; latest.forEach(t => D.gapsOf(t).forEach(g => gapCount[g]++));
  const topGap = Object.entries(gapCount).sort((a, b) => b[1] - a[1])[0];
  const RECIPE = { k: 'Raise potassium: feed the larvae a higher share of fruit peels (banana, papaya, melon rind) and blend the frass with a potassium-rich amendment. Re-test each batch before listing.', n: 'Raise nitrogen: shorten curing time and feed more protein-rich cooked waste so less nitrogen is lost before bagging.', p: 'Raise phosphorus: add more grain and okara to the feed mix; bone meal stays out because bones slow the larvae.', ph: 'Buffer acidity: frass is near-neutral, so recommend a higher application rate on acidic soils.', om: 'Add organic matter: sell a coarser frass-compost blend for soils low in organic matter.' };
  const recent = fb.filter(x => x.comment).sort((a, b) => b.at - a.at).slice(0, 6);
  return html`<div class="row wrap between"><div class="field" style="min-width:240px"><label for="an-f">Facility</label><select id="an-f" class="input" value=${fid} onChange=${e => setFid(e.target.value)}><option value="All">All facilities</option>${D.facilities.map(f => html`<option value=${f.id}>${f.name}</option>`)}</select></div>
      <span class="small muted">${fb.length} responses from ${new Set(fb.map(x => x.buyerId)).size} buyers</span></div>
    ${!fb.length ? html`<div class="card"><${Empty} title="No feedback yet">Feedback from buyers will be analysed here.</${Empty}></div>` : html`
    <div class="stats"><${Stat} v=${fmt(crit[0][2], 1)} unit="/ 5" k="Fits buyers' needs" d="Average of the fit question"/><${Stat} v=${pct(fitPct)} k="Rated fit 4 or 5" tone=${fitPct >= 0.7 ? 'var(--good)' : 'var(--warn)'}/>
      <${Stat} v=${fmt(avg(crit.map(x => x[2])), 1)} unit="/ 5" k="Overall satisfaction" d="Mean of 5 criteria"/><${Stat} v=${issues[0] ? issues[0][1] : 0} k=${issues[0] ? 'Mentions of “' + issues[0][0].toLowerCase() + '”' : 'Issues reported'} d="Most common issue" tone=${issues[0] ? 'var(--warn)' : ''}/></div>
    <div class="split"><div class="card"><div class="card-h"><h3>Fit by buyer segment</h3><span class="tiny faint">Average score, 1–5</span></div>
        <div class="table-wrap"><table class="heat"><thead><tr><th>Segment</th>${CRITERIA.map(([, l]) => html`<th>${l.replace('Fits our needs', 'Fit').replace('Value for money', 'Value')}</th>`)}<th>n</th></tr></thead>
          <tbody>${segs.map(([s, a]) => html`<tr><td>${SEGMENTS[s]}</td>${CRITERIA.map(([k]) => { const v = avg(a.map(x => x[k])); return html`<td style=${heatBg(v)} onMouseEnter=${tipOn(`${SEGMENTS[s]} · ${fmt(v, 2)} from ${a.length} responses`)} onMouseLeave=${tipOff}>${fmt(v, 1)}</td>`; })}<td class="faint" style="background:none">${a.length}</td></tr>`)}</tbody></table></div>
        <div style="margin-top:16px">${crit.map(([k, l, v]) => html`<div class="hbar"><span class="small">${l}</span><${Bar} p=${(v - 1) / 4}/><span class="num small">${fmt(v, 1)}</span></div>`)}</div></div>

    <div class="card"><div class="card-h"><h3>Product fit</h3><span class="tiny faint">Does each product fit what buyers need?</span></div>
      <div class="table-wrap"><table class="t"><thead><tr><th>Product</th><th class="r">Responses</th><th>Fit score</th><th>Top issue</th></tr></thead><tbody>
        ${prods.map(({ p, n, fit, issue }) => html`<tr><td><b class="small">${p.name}</b><div class="tiny faint">${D.facById[p.facilityId]?.name}</div></td><td class="r num">${n}</td>

          <td>${issue ? html`<span class="pill warn">${issue[0]}</span>` : html`<span class="faint small">None</span>`}</td></tr>`)}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Latest comments</h3></div>${recent.map(x => html`<div class="comment"><div class="row between wrap"><span class="small"><b>${D.prodById[x.productId]?.name}</b> · <span class="muted">${SEGMENTS[x.segment]}</span></span><${Stars} v=${x.fit}/></div><p class="small">“${x.comment}”</p><span class="tiny faint">${ago(x.at, c.now)}</span></div>`)}</div>`}`;
}

  const [busy, setBusy] = useState(false);

          <div class="soilrange"><div class="band"><div class="ok" style=${`left:${x(b[0])}%;width:${x(b[1]) - x(b[0])}%`}></div></div>

function GiveFeedback({ c, productId }) {

  const [pid, setPid] = useState(productId || bought[0] || D.products[0]?.id);
  const [sc, setSc] = useState({ fit: 0, quality: 0, consistency: 0, delivery: 0, value: 0 });
  const [tags, setTags] = useState([]); const [txt, setTxt] = useState(''); const [busy, setBusy] = useState(false);
  useEffect(() => { if (productId) setPid(productId); }, [productId]);
  const ok = Object.values(sc).every(v => v > 0);
  const submit = async e => { e.preventDefault(); if (!ok) return; setBusy(true); const p = D.prodById[pid];
    await c.act.submitFeedback({ productId: pid, facilityId: p.facilityId, buyerId: persona.id, segment: persona.segment || 'farm', ...sc, tags, comment: txt.trim() });
    setBusy(false); setSc({ fit: 0, quality: 0, consistency: 0, delivery: 0, value: 0 }); setTags([]); setTxt(''); };
  if (role !== 'buyer') return html`<div class="card"><${Empty} title="Feedback comes from buyers">Switch to a buyer account to rate a product. Facilities see the results in Feedback analytics.</${Empty}><div class="row" style="justify-content:center"><button class="btn primary" onClick=${() => c.setRole('buyer')}>${Ic.swap()} Switch to buyer</button></div></div>`;
  return html`<form class="card stack" style="gap:16px;max-width:760px" onSubmit=${submit}><div class="card-h" style="margin:0"><div><div class="eyebrow">Feedback channel</div><h2>How well does it fit your needs?</h2></div><span class="pill kaya">+15 pts</span></div>

    <div class="field"><span class="label">Anything to flag?</span><div class="chips">${[...GOOD_TAGS, ...BAD_TAGS].map(t => html`<button type="button" class="chip" aria-pressed=${tags.includes(t)} onClick=${() => setTags(tags.includes(t) ? tags.filter(x => x !== t) : [...tags, t])}>${t}</button>`)}</div></div>
    <div class="field"><label for="fb-c">Comment (optional)</label><textarea id="fb-c" class="input" value=${txt} onInput=${e => setTxt(e.target.value)} placeholder="What should the facility change?"></textarea></div>
    <div class="row between wrap"><span class="tiny faint">Your segment (${SEGMENTS[persona.segment]}) is shared with the facility, not your name.</span><button class="btn primary" type="submit" disabled=${!ok || busy}>${busy ? 'Sending…' : 'Send feedback'}</button></div></form>`;

function Impact({ c }) {
  const { D } = c;
  const delivered = sum(D.deliveries, d => d.kg);
  const caddies = sum(D.pickups, p => p.caddies || (p.stops || []).length || 0);
  const recovered = sum(D.drops.filter(d => !WASTE_TYPES[d.type]?.bsf), d => d.kg);
  const bsfDrops = D.drops.filter(d => WASTE_TYPES[d.type]?.bsf); const cleanRate = bsfDrops.length ? bsfDrops.filter(d => d.clean).length / bsfDrops.length : 0;

function derive(data, now, roleState) {
  const bins = data.bins.map(b => binState(b, now));
  const binById = Object.fromEntries(bins.map(b => [b.id, b]));
  const facilities = data.facilities.slice().sort((a, b) => b.dailyQuotaKg - a.dailyQuotaKg);
  const facById = Object.fromEntries(facilities.map(f => [f.id, f]));
  const products = data.products.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const prodById = Object.fromEntries(products.map(p => [p.id, p]));
  const sod = startOfDaySG(now);
  const intake = {}; data.deliveries.filter(d => d.at >= sod).forEach(d => intake[d.facilityId] = (intake[d.facilityId] || 0) + d.kg);
  const openCapacity = sum(facilities, f => Math.max(0, f.dailyQuotaKg - (intake[f.id] || 0)));
  const readyBins = bins.filter(b => b.p >= READY);
  const ratings = {}; Object.entries(groupBy(data.feedback, f => f.productId)).forEach(([pid, a]) => { ratings[pid] = { n: a.length, fit: avg(a.map(x => x.fit)), overall: avg(a.map(x => avg(CRITERIA.map(([k]) => x[k] || x.fit)))) }; });
  const bal = {}, life = {}; data.ledger.forEach(l => { bal[l.who] = (bal[l.who] || 0) + l.delta; if (l.delta > 0) life[l.who] = (life[l.who] || 0) + l.delta; });
  const lbMap = {}; data.drops.filter(d => d.at > now - 30 * DAY && WASTE_TYPES[d.type]?.bsf).forEach(d => lbMap[d.binId] = (lbMap[d.binId] || 0) + d.kg);
  const leaderboard = Object.entries(lbMap).map(([binId, kg]) => ({ binId, kg, name: binById[binId]?.name || binId, zone: binById[binId]?.zone || '' })).sort((a, b) => b.kg - a.kg);
  const facDays = fid => Array.from({ length: 7 }, (_, i) => { const s = sod - (6 - i) * DAY; return { label: dayLabel(s + 12 * H), v: sum(data.deliveries.filter(d => d.facilityId === fid && d.at >= s && d.at < s + DAY), d => d.kg), today: i === 6 }; });
  const gapsOf = t => { const band = CROPS[t.crop] || CROPS['Leafy greens']; return ['n', 'p', 'k', 'ph', 'om'].filter(k => t[k] != null && t[k] < band[k][0]); };
  const rankFor = (gaps, seg) => products.filter(p => p.active !== false && p.stock > 0).map(p => {
    let s = (p.segments || []).includes(seg) ? 3 : 0; const why = [];
    if (p.n != null) { if (gaps.includes('k')) { s += p.k * 2.2; if (p.k >= 3) why.push('High potassium (' + p.k + '% K)'); } if (gaps.includes('n')) { s += p.n * 1.6; if (p.n >= 3) why.push('Nitrogen-rich'); } if (gaps.includes('p')) { s += p.p * 1.6; if (p.p >= 2.4) why.push('Good phosphorus'); } if (gaps.includes('om')) { s += 2; why.push('Adds organic matter'); } if (gaps.includes('ph')) { s += 1; } }
    else if (gaps.length && seg !== 'aquaculture') s -= 3;
    s += (ratings[p.id]?.overall || 3) * 0.6;
    return { ...p, score: s, why: why[0] || ((p.segments || []).includes(seg) ? 'Popular with ' + SEGMENTS[seg].toLowerCase() + 's' : 'Well rated') };
  }).sort((a, b) => b.score - a.score);
  const buyerSegs = { ...Object.fromEntries(PERSONAS_R[REG].buyer.map(p => [p.id, p.segment])) }; data.feedback.forEach(f => { if (!buyerSegs[f.buyerId]) buyerSegs[f.buyerId] = f.segment; });
  const recsFor = buyerId => { const tests = data.soiltests.filter(t => t.buyerId === buyerId).sort((a, b) => b.at - a.at); const seg = buyerSegs[buyerId] || 'farm'; const gaps = tests[0] ? gapsOf(tests[0]) : []; const r = rankFor(gaps, seg); r.gap = gaps; r.test = tests[0]; return r; };
  const pickupsAll = data.pickups;
  const activePickup = roleState.role === 'collector' ? pickupsAll.find(p => p.status === 'Active' && p.collectorId === roleState.personaId) : pickupsAll.find(p => p.status === 'Active');
  const kmSaved = sum(pickupsAll.filter(p => p.status === 'Delivered'), p => Math.max(0, p.baselineKm - p.km));
  const nutrientsKg = sum(data.orders.flatMap(o => o.items), i => { const p = prodById[i.productId]; return p && p.n != null ? i.qty * unitKg(p) * (p.n + p.p + p.k) / 100 : 0; });
  return {
    ...data, bins, binById, facilities, facById, products, prodById, intake, openCapacity, readyBins, overflowing: bins.filter(b => b.status === 'overflow').length,
    ratings, balance: w => Math.round(bal[w] || 0), lifetime: w => Math.round(life[w] || 0), leaderboard, facDays, gapsOf, rankFor, recsFor,
    buyerSeg: id => buyerSegs[id], activePickup, kmSaved, nutrientsKg,
    deliveredToday: sum(Object.values(intake)), deliveredKg7: sum(data.deliveries.filter(d => d.at >= sod - 6 * DAY), d => d.kg),
    dropsKg30: sum(data.drops.filter(d => d.at > now - 30 * DAY), d => d.kg), unitsSold: sum(data.orders.flatMap(o => o.items), i => i.qty),
    pointsIssued: sum(data.ledger.filter(l => l.delta > 0), l => l.delta), depotFor: id => depots().find(d => d.id === id) || depots()[0],
  };
}

  const dataR = useMemo(() => Object.fromEntries(COLS.map(c => [c, c === 'ledger' ? data[c] : data[c].filter(x => (x.region || 'sg') === REG)])), [data, region]);
  const personasFor = (r, reg = REG) => r === 'facility' ? (data.facilities.some(f => (f.region || 'sg') === reg) ? data.facilities.filter(f => (f.region || 'sg') === reg).sort((a, b) => b.dailyQuotaKg - a.dailyQuotaKg).map(f => ({ id: f.id, name: f.name, sub: 'BSF facility · ' + f.area })) : [{ id: reg === 'kr' ? 'kr-f1' : 'f-tuas', name: reg === 'kr' ? 'Gangseo Larva Center' : 'Tuas Larva Works', sub: 'BSF facility' }]) : PERSONAS_R[reg][r];

    const pl = personasFor(r, reg); const p = pl.find(x => x.id === ids[key]) || pl[0];

  const open = (type, props = {}) => setSheet({ type, props });
  const close = () => setSheet(null);

  /* write helper: falls back to a device-only copy if the viewer can't write shared data */
  async function run(op, ok, opts) {

    catch (e) {
      if (boot?.mode === 'cloud' && ['invalid_argument', 'not_granted', 'revoked'].includes(e?.code)) {
        const local = new LocalStore(toMaps(dataRef.current), null); storeRef.current = local; setBoot({ store: local, mode: 'readonly' });

        try { const r = await op(local); if (ok) toast(ok, opts); return r ?? true; } catch (e2) { toast('That didn\'t save. Try again.', { err: true }); return false; }
      }
      toast(e?.code === 'quota_exceeded' ? 'The database is full. Remove old records to add new ones.' : 'That didn\'t save. Check your connection and try again.', { err: true }); return false;

  }
  const award = (st, who, delta, reason) => st.add('ledger', { who, delta, reason, at: Date.now() });

  const act = {

      const bsf = WASTE_TYPES[type].bsf; const p = bsf ? Math.round(kg * 2) + (clean ? 10 : 0) : 5;

    simulate: kind => run(async st => {

      const ups = bs.map(b => { let kg;
        if (kind === 'hour') kg = Math.min(b.capacityKg, b.kg + b.ratePerHr * (1.6 + Math.random()));
        else if (kind === 'lunch') kg = b.capacityKg * (Math.random() < 0.45 ? 0.8 + Math.random() * 0.22 : 0.35 + Math.random() * 0.4);
        else kg = b.capacityKg * (0.08 + Math.random() * 0.3);
        const patch = { fillKg: Math.round(Math.min(b.capacityKg, kg)), updatedAt: t }; if (kind === 'morning') { patch.lastEmptiedAt = t - 8 * H; if (b.contamPct > CONTAM_LIMIT) patch.contamPct = 4.2; } return [b.id, patch]; });
      for (let i = 0; i < ups.length; i += 6) await Promise.all(ups.slice(i, i + 6).map(([id, p]) => st.update('bins', id, p)));
    }, kind === 'hour' ? 'Sensors moved forward 1 hour' : kind === 'lunch' ? 'Lunch rush simulated: check the ready bins' : 'Bins reset to an early-morning state'),
    startRoute: plan => run(async st => {
      await st.add('pickups', { region: REG, collectorId: persona.id, depot: plan.depot.id, zone: plan.area === 'All' ? 'Island-wide' : plan.area, facilityId: plan.fac.id, stops: plan.seq.map(b => ({ binId: b.id, kg: b.kg, done: false })), loadKg: plan.load, km: +plan.km.toFixed(1), baselineKm: +plan.baselineKm.toFixed(1), status: 'Active', at: Date.now() });
    }, 'Route started. Tick off each stop as you collect.'),
    collectStop: (p, i) => run(async st => {
      const t = Date.now(); const s = p.stops[i]; const b = binState(dataRef.current.bins.find(x => x.id === s.binId), t);
      await st.update('bins', s.binId, { fillKg: 0, updatedAt: t, lastEmptiedAt: t });
      const stops = p.stops.map((x, j) => j === i ? { ...x, done: true, kg: b.kg, at: t } : x);
      await st.update('pickups', p.id, { stops });
    }, 'Collected · caddy swapped'),
    deliverRoute: p => run(async st => {
      const done = p.stops.filter(s => s.done); const kg = sum(done, s => s.kg); const t = Date.now();
      await st.add('deliveries', { region: REG, facilityId: p.facilityId, collectorId: p.collectorId, kg, stops: done.length, km: p.km, at: t });
      await st.update('pickups', p.id, { status: 'Delivered', loadKg: kg, stops: done, caddies: done.length, at: t });
      const ptsN = Math.round(kg / 10) + 25; await award(st, p.collectorId, ptsN, `Route delivered · ${fmt(kg)} kg to BSF`);
      return [ptsN, kg];
    }).then(r => r && toast(impactBurst(r[1], r[0], 'delivered to ' + (D.facById[p.facilityId]?.name || 'BSF')), { ms: 5200, burst: true })),
    cancelRoute: p => run(st => st.del('pickups', p.id), 'Route cancelled'),
    saveFacility: (id, patch) => run(st => st.update('facilities', id, patch), 'Quota updated. Collectors see it now.'),
    saveProduct: (id, body) => run(async st => { if (id) await st.set('products', id, body); else await st.add('products', { ...body, region: REG }); }, id ? 'Listing updated' : 'Product listed in the marketplace'),
    placeOrder: ({ lines, voucher, points, subtotal, total }) => run(async st => {
      const t = Date.now(); const items = lines.map(l => ({ productId: l.id, name: l.p.name, qty: l.qty, price: l.p.price, facilityId: l.p.facilityId }));
      await st.add('orders', { region: REG, buyerId: persona.id, items, subtotal: +subtotal.toFixed(2), pointsUsed: points, voucherValue: voucher ? voucher.value : 0, discount: +(subtotal - total).toFixed(2), total: +total.toFixed(2), status: 'Confirmed', at: t });
      for (const l of lines) await st.update('products', l.id, { stock: Math.max(0, (l.p.stock || 0) - l.qty) });
      if (points > 0) await award(st, persona.id, -points, 'Used at checkout');
      if (voucher) await st.update('vouchers', voucher.id, { used: true });
      const earn = Math.floor(total / R_().unit); if (earn > 0) await award(st, persona.id, earn, 'Purchase reward (1% back)');
      setCart([]); return earn;
    }).then(n => { if (n !== false) toast(html`<span class="row"><${Coin}/>Order placed · +${n} points</span>`); return n !== false; }),
    redeem: r => run(async st => {
      if (D.balance(persona.id) < r.cost) throw { code: 'local', message: 'Not enough points' };
      await award(st, persona.id, -r.cost, 'Redeemed: ' + r.title);
      await st.add('vouchers', { region: REG, who: persona.id, rewardId: r.id, title: r.title, value: r.value || 0, min: r.min || 0, code: code(), used: false, at: Date.now() });
    }, null).then(ok => ok && toast(html`<span class="row">${Ic.gift()} Redeemed: ${r.title}. Voucher added.</span>`)),
    submitFeedback: fb => run(async st => { await st.add('feedback', { region: REG, ...fb, at: Date.now() }); await award(st, fb.buyerId, 15, 'Product feedback'); }, null).then(ok => ok && toast(html`<span class="row"><${Coin}/>+15 points · thanks, the facility sees this now</span>`)),
    submitSoil: t => run(async st => { await st.add('soiltests', { region: REG, ...t, at: Date.now() }); await award(st, t.buyerId, 20, 'Soil test submitted'); }, null).then(ok => ok && toast(html`<span class="row"><${Coin}/>+20 points · soil test saved</span>`)),
    seedCloud: () => run(async st => {
      const seed = await loadSeed(); if (!seed) throw { code: 'local' }; const maps = rebaseSeed(seed);
      for (const col of COLS) { const ents = Object.entries(maps[col]); for (let i = 0; i < ents.length; i += 5) await Promise.all(ents.slice(i, i + 5).map(([id, d]) => st.set(col, id, d))); }
      setBoot(b => ({ ...b, empty: false }));
    }, 'Sample data loaded'),
    resetLocal: async () => { try { localStorage.removeItem('sh-local-v2'); } catch { } const seed = await loadSeed(); if (!seed) return; const local = new LocalStore(rebaseSeed(seed), boot.mode === 'local' ? 'sh-local-v2' : null); storeRef.current = local; setBoot({ store: local, mode: boot.mode }); setSheet(null); toast('Demo data reset'); },
  };
  const addToCart = (id, n = 1) => { setCart(cs => { const f = cs.find(x => x.id === id); return f ? cs.map(x => x.id === id ? { ...x, qty: x.qty + n } : x) : [...cs, { id, qty: n }]; }); toast(html`<span class="row">${Ic.cart()} Added to cart</span>`, { ms: 1500 }); };
  const setQty = (id, n) => setCart(cs => n <= 0 ? cs.filter(x => x.id !== id) : cs.map(x => x.id === id ? { ...x, qty: n } : x));

  const c = { D, now, role, persona, moreItems: [], setRole, personasFor, go, open, close, act, cart, addToCart, setQty, mode: boot?.mode, empty: boot?.empty, toast };
  const cartN = sum(cart, x => x.qty);
  const readyN = D.readyBins.filter(b => !b.held).length;
  const navBadge = k => k === 'map' && readyN ? readyN : null;

  if (!boot) return html`<div class="splash"><div class="in"><${Mark} size=${84}/><div class="brand-name" style="font-size:24px">Second <b>Harvest</b></div><div class="small muted">Giving food a second life!</div></div></div>`;

  const allowed = ROLE_NAV[role]; const navItems = NAV.filter(n => allowed.includes(n[0]));
  const tabItems = navItems.length <= 5 ? navItems.map(n => [n[0], n[3], n[2]]) : [...navItems.slice(0, 4).map(n => [n[0], n[3], n[2]]), ['more', 'More', Ic.dots]];
  const moreItems = navItems.length <= 5 ? [] : navItems.slice(4);
  const V = { home: Home, map: MapView, quotas: Quotas, market: Market, rewards: Rewards, insights: Insights, impact: Impact }[view] || Home;
  const title = view === 'home' ? `Hello, ${persona.name.split(' ')[0]}` : NAV.find(n => n[0] === view)[1];
  const modeLabel = boot.mode === 'cloud' ? 'Live shared database' : boot.mode === 'readonly' ? 'Viewing shared data' : 'Device-only demo';
  const S = sheet && ({ role: RoleSheet, about: AboutSheet, quota: QuotaSheet, product: ProductSheet, cart: CartSheet, editProduct: ProductEditSheet, drop: DropSheet, more: MoreSheet })[sheet.type];
  return html`<div class="shell">
    <aside class="side">
      <div class="brand"><${Mark} cls="brand-mark" size=${42}/><div><div class="brand-name">Second <b>Harvest</b></div><div class="brand-tag">Giving food a second life!</div></div></div>
      <button class="persona-btn" onClick=${() => open('role')} aria-label="Switch account"><${Avatar} role=${role}/><div class="grow" style="min-width:0"><div class="role">${ROLE_LABEL[role]}</div><div class="who">${persona.name}</div></div><span style="width:18px;color:var(--ink-3)" class="swap-ic">${Ic.swap()}</span></button>
      <nav class="nav" aria-label="Main">${NAV.filter(n => ROLE_NAV[role].includes(n[0])).map(([k, l, I, s]) => html`<button aria-current=${view === k ? 'page' : null} onClick=${() => go(k)} title=${l}>${I()}<span class="lbl">${l}</span><span class="lbl-short">${s}</span>${navBadge(k) && html`<span class="badge">${navBadge(k)}</span>`}</button>`)}</nav>
      <div class="side-foot"><button class="mode" onClick=${() => open('about')} title=${modeLabel}><span class=${'dot ' + (boot.mode === 'cloud' ? 'live' : 'local')}></span><span class="mode-txt"><b style="color:var(--ink)">${modeLabel}</b><br/>Prototype · sample data</span></button></div>
    </aside>
    <div class="main">
      <header class=${'top' + (scrolled ? ' scrolled' : '')}>
        <${Mark} cls="top-mark" size=${34}/>
        <div style="min-width:0"><h1>${title}</h1>${SUBS[view] ? html`<div class="sub">${SUBS[view]}</div>` : view === 'home' && html`<div class="sub">${ROLE_LABEL[role]} · ${persona.sub}</div>`}</div>
        <div class="top-actions">
          ${role !== 'facility' && html`<button class="points" onClick=${() => go('rewards')} aria-label="Harvest points"><${Coin}/><span class="num">${fmt(D.balance(persona.id))}</span></button>`}
          ${(role === 'buyer' || cartN > 0) && html`<button class="icon-btn" aria-label="Cart" onClick=${() => open('cart')}>${Ic.cart()}${cartN > 0 && html`<span class="badge">${cartN}</span>`}</button>`}
          <button class="icon-btn phone-only" aria-label="Switch account" onClick=${() => open('role')}>${Ic.user()}</button>
        </div></header>
      <main class="view" key=${view + REG + role + persona.id}><${V} c=${c} params=${params}/></main>
    </div>
    <nav class="tabs" aria-label="Main" style=${`grid-template-columns:repeat(${tabItems.length},1fr)`}>${tabItems.map(([k, l, I]) => html`<button aria-current=${(k === view || (k === 'more' && moreItems.some(m => m[0] === view))) ? 'page' : null} onClick=${() => k === 'more' ? open('more') : go(k)}>${I()}<span>${l}</span>${navBadge(k) && html`<span class="badge">${navBadge(k)}</span>`}</button>`)}</nav>
    ${S && html`<${S} c=${c} ...${sheet.props} onClose=${close}/>`}
    <div class="toasts" aria-live="polite">${toasts.map(t => html`<div class=${'toast' + (t.err ? ' err' : '') + (t.burst ? ' burst-t' : '')}>${t.text}</div>`)}</div>
    <${RoleNote} note=${roleNote}/>
    <${TipLayer}/>
  </div>`;
}

function MoreSheet({ c, onClose }) {
  return html`<${Sheet} title="More" onClose=${onClose}>
    <button class="persona-btn" onClick=${() => c.open('role')}><${Avatar} role=${c.role}/><div class="grow"><div class="role">${ROLE_LABEL[c.role]}</div><div class="who">${c.persona.name}</div></div>${Ic.swap()}</button>
    <div class="list">${(() => { const n = NAV.filter(v => ROLE_NAV[c.role].includes(v[0])); return n.length > 5 ? n.slice(4) : []; })().map(([k, l, I]) => [k, l, I]).map(([k, l, I]) => html`<button class="li" onClick=${() => c.go(k)}><span style="width:22px;color:var(--brand)">${I()}</span><span class="grow" style="font-weight:650">${l}</span><span style="width:18px;color:var(--ink-3)">${Ic.chev()}</span></button>`)}
      <button class="li" onClick=${() => c.open('about')}><span style="width:22px;color:var(--brand)">${Ic.info()}</span><span class="grow" style="font-weight:650">About this prototype</span><span style="width:18px;color:var(--ink-3)">${Ic.chev()}</span></button></div>
  </${Sheet}>`;
}

render(html`<${App}/>`, document.getElementById('app'));

</script>
</body></html>
